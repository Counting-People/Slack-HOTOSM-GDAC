name: Disaster & Outbreak Alerts

on:
  schedule:
    - cron: '1 0 * * *'   # 00:01 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'WHO DON dry run (preview only, no Slack post)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run GDACS alert check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python gdacs-slack.py

      - name: Run WHO DON alert check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python who-don-slack.py

      - name: Commit updated state files
        if: always()
        run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add posted_events.json
                if [ -f posted_dons.json ]; then git add posted_dons.json; fi
                git diff --staged --quiet || git commit -m "Update posted event state"
                git push
